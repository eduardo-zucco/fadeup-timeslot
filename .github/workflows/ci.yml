name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Testes com relatório JUnit
        run: npm run test:ci
      - name: Verificar sintaxe
        run: npm run check
      - name: Construir artefato
        run: npm run build
      - name: Salvar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fadeup-test-results
          path: test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Salvar build
        uses: actions/upload-artifact@v4
        with:
          name: fadeup-worker
          path: dist/
          include-hidden-files: true
          retention-days: 14
