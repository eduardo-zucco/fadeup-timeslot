services:
  backend:
    build:
      context: ./project/backend
    image: fadeup-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # exposto só no localhost da VPS; o nginx do host faz o proxy (/api -> aqui)
      - "127.0.0.1:8000:8000"
    environment:
      USER_MYSQL_FADEUP: ${USER_MYSQL_FADEUP}
      PASS_MYSQL_FADEUP: ${PASS_MYSQL_FADEUP}
      HOST_MYSQL_FADEUP: ${HOST_MYSQL_FADEUP}
      PORT_MYSQL_FADEUP: ${PORT_MYSQL_FADEUP:-3306}
      BASE_MYSQL_FADEUP: ${BASE_MYSQL_FADEUP}
      JWT_SECRET: ${JWT_SECRET}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      REFRESH_USER_HOURS: ${REFRESH_USER_HOURS:-2}
      APP_REFRESH_DAYS: ${APP_REFRESH_DAYS:-7}
      FRONT_ORIGINS: ${FRONT_ORIGINS}

  frontend:
    build:
      context: ./project/frontend
      args:
        # vazio = caminho relativo (/api); front e API no mesmo domínio via nginx do host
        VITE_API_BASE: ${VITE_API_BASE}
        VITE_APP_CLIENT_ID: ${VITE_APP_CLIENT_ID}
        VITE_APP_CLIENT_SECRET: ${VITE_APP_CLIENT_SECRET}
    image: fadeup-frontend
    restart: unless-stopped
    ports:
      # exposto só no localhost da VPS; o nginx do host faz o proxy (/ -> aqui)
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
